apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-app-config
  namespace: ledger
data:
  DATABASE_URL: "postgresql+psycopg2://ledger:ledger@postgres:5432/ledger"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-app
  namespace: ledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-app
  template:
    metadata:
      labels:
        app: ledger-app
    spec:
      containers:
        - name: ledger-app
          image: ledger-app:local  # built locally via `docker build -t ledger-app:local .`
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ledger-app-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-app
  namespace: ledger
spec:
  selector:
    app: ledger-app
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
