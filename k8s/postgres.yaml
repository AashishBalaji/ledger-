apiVersion: v1
kind: Secret
metadata:
  name: ledger-postgres-secret
  namespace: ledger
type: Opaque
stringData:
  POSTGRES_USER: ledger
  POSTGRES_PASSWORD: ledger
  POSTGRES_DB: ledger
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ledger
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # headless, matches the single-replica StatefulSet below
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledger
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: ledger-postgres-secret
          env:
            # Explicit (not just envFrom) so $(POSTGRES_USER)/$(POSTGRES_DB)
            # below are guaranteed available for Kubernetes' own $(VAR)
            # command-substitution, rather than relying on envFrom-sourced
            # vars being expandable the same way.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-secret
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata  # avoids postgres's lost+found-in-empty-volume complaint
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
