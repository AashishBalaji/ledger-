apiVersion: v1
kind: Secret
metadata:
  name: ledger-postgres-secret
  namespace: ledger
type: Opaque
stringData:
  POSTGRES_USER: ledger
  POSTGRES_PASSWORD: ledger
  POSTGRES_DB: ledger
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ledger
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # headless, matches the single-replica StatefulSet below
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledger
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: ledger-postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata  # avoids postgres's lost+found-in-empty-volume complaint
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ledger", "-d", "ledger"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ledger", "-d", "ledger"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
