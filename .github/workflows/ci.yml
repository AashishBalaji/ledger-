name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests (closed-form + property-based validation)
        run: |
          set -o pipefail
          pytest tests/unit -v -rf 2>&1 | tee pytest-output.txt
      - name: Integration tests (real Postgres, real HTTP layer)
        run: |
          set -o pipefail
          pytest tests/integration -v -rf 2>&1 | tee -a pytest-output.txt
      - name: Agentic triage of failures
        if: failure() && secrets.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ledger.agents.triage --pytest-output pytest-output.txt --output triage-report.md
      - name: Upload triage report
        if: failure() && secrets.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: triage-report
          path: triage-report.md

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run benchmark suite
        run: pytest tests/benchmarks --benchmark-only --benchmark-json=current-benchmarks.json
      - name: Check for regressions against committed baseline
        run: |
          set -o pipefail
          python scripts/compare_benchmarks.py current-benchmarks.json benchmarks/baseline.json --threshold 0.5 \
            | tee benchmark-compare-output.txt
      - name: Agentic triage of benchmark regressions
        if: failure() && secrets.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ledger.agents.triage --benchmark-output benchmark-compare-output.txt --output triage-report.md
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            current-benchmarks.json
            triage-report.md
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ledger-app:ci .
      - name: Smoke-test container against a live Postgres service
        run: |
          docker network create ledger-ci-net
          docker run -d --name ledger-ci-postgres --network ledger-ci-net \
            -e POSTGRES_USER=ledger -e POSTGRES_PASSWORD=ledger -e POSTGRES_DB=ledger \
            postgres:16-alpine
          for i in $(seq 1 20); do
            docker exec ledger-ci-postgres pg_isready -U ledger -d ledger && break
            sleep 2
          done
          docker run -d --name ledger-ci-app --network ledger-ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg2://ledger:ledger@ledger-ci-postgres:5432/ledger \
            ledger-app:ci
          for i in $(seq 1 20); do
            curl --fail http://localhost:8000/health && break
            if [ "$i" -eq 20 ]; then
              echo "App never became healthy" >&2
              docker logs ledger-ci-app
              exit 1
            fi
            sleep 2
          done
          docker logs ledger-ci-app
